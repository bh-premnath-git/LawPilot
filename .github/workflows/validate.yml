name: Validate backend layers
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_DB: lawpilot
          POSTGRES_PASSWORD: local-ci-postgres-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d lawpilot"
          --health-interval 5s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/ai-capabilities/requirements.txt
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: services/workflow-service/go.sum
      - name: API and orchestration
        run: |
          npm ci
          npm run build
          npm test
          python3 scripts/verify_structure.py
          python -m pip install PyYAML==6.0.3
          python scripts/verify_deployment.py
      - name: Protobuf governance and generated client drift
        run: |
          python -m pip install grpcio-tools==1.76.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.6
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          RPC_GO_BIN="$(go env GOPATH)/bin" npm run generate:rpc
          git diff --exit-code -- contracts/gen packages/rpc/src/generated
          mkdir -p work
          curl -fsSL https://github.com/bufbuild/buf/releases/download/v1.75.0/buf-Linux-x86_64 -o work/buf
          chmod +x work/buf
          work/buf lint
          git fetch origin main:refs/remotes/origin/main
          work/buf breaking --against '.git#ref=origin/main,subdir=contracts/proto'
      - name: Python capabilities
        working-directory: services/ai-capabilities
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q
      - name: Business workflows
        working-directory: services/workflow-service
        run: go test ./...
      - name: Provider integration
        working-directory: services/provider-router
        run: go test ./...
      - name: Document processing
        working-directory: services/document-worker
        run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng
          rustup toolchain install 1.90.0 --profile minimal
          cargo +1.90.0 test --locked
      - name: Persistence migrations and tenant isolation
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: local-ci-postgres-only
          PGDATABASE: lawpilot
        run: |
          psql -v ON_ERROR_STOP=1 -f db/001_init.sql
          psql -v ON_ERROR_STOP=1 -f db/002_tenant_directory_rls.sql
          psql -v ON_ERROR_STOP=1 -f db/003_execution_outbox.sql
          psql -v ON_ERROR_STOP=1 -f db/004_pgvector.sql
          psql -v ON_ERROR_STOP=1 -f db/005_durable_executions.sql
          psql -v ON_ERROR_STOP=1 -f db/006_execution_input_json.sql
          psql -v ON_ERROR_STOP=1 -f db/007_calendar_domain.sql
          psql -v ON_ERROR_STOP=1 -f db/008_calendar_overlap_policy.sql
          psql -v ON_ERROR_STOP=1 -f db/009_events_context.sql
          psql -v ON_ERROR_STOP=1 -f db/010_authoritative_evidence.sql
          psql -v ON_ERROR_STOP=1 -f db/011_file_provider_integrations.sql
          psql -v ON_ERROR_STOP=1 -f db/012_legal_generation_review.sql
          psql -v ON_ERROR_STOP=1 -f db/013_integration_command_governance.sql
          psql -v ON_ERROR_STOP=1 -f db/014_page_provenance.sql
          psql -v ON_ERROR_STOP=1 -f db/015_operational_controls.sql
          psql -v ON_ERROR_STOP=1 -f db/016_sync_context_extensions.sql
          psql -v ON_ERROR_STOP=1 -f db/017_knowledge_authorization.sql
          psql -v ON_ERROR_STOP=1 -f db/018_review_and_queue_visibility.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/pgvector.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/tenant_isolation.sql

      - name: Durable execution database integration
        env:
          TEST_DATABASE_URL: postgresql://postgres:local-ci-postgres-only@localhost:5432/lawpilot
          TEST_APP_DATABASE_URL: postgresql://lawpilot_app:local-dev-app-only@localhost:5432/lawpilot
          TEST_WORKFLOW_DATABASE_URL: postgresql://lawpilot_workflow:local-dev-workflow-only@localhost:5432/lawpilot
          TEST_DISPATCHER_DATABASE_URL: postgresql://lawpilot_dispatcher:local-dev-dispatcher-only@localhost:5432/lawpilot
        run: |
          npm run test -w @lawpilot/platform-api
          (cd services/workflow-service && go test -count=1 ./executions)
      - name: Native calendar database integration
        env:
          TEST_DATABASE_URL: postgresql://postgres:local-ci-postgres-only@localhost:5432/lawpilot
          TEST_CALENDAR_DATABASE_URL: postgresql://lawpilot_calendar:local-dev-calendar-only@localhost:5432/lawpilot
        working-directory: services/calendar-service
        run: go test -count=1 ./...
      - name: Event delivery, secure retrieval and authoritative evidence integration
        env:
          TEST_DATABASE_URL: postgresql://postgres:local-ci-postgres-only@localhost:5432/lawpilot
          TEST_CONTEXT_DATABASE_URL: postgresql://lawpilot_context:local-dev-context-only@localhost:5432/lawpilot
          TEST_EVENT_DATABASE_URL: postgresql://lawpilot_events:local-dev-events-only@localhost:5432/lawpilot
        working-directory: services/context-engine
        run: go test -count=1 ./...
      - name: Workload controls and configured provider database integration
        env:
          TEST_DATABASE_URL: postgresql://postgres:local-ci-postgres-only@localhost:5432/lawpilot
          TEST_INTEGRATION_DATABASE_URL: postgresql://lawpilot_integration:local-dev-integration-only@localhost:5432/lawpilot
        run: |
          (cd packages/workload && go test ./...)
          (cd services/integration-service && go test -count=1 ./...)
      - name: Configured file and legal generation process integration
        env:
          TEST_DATABASE_URL: postgresql://postgres:local-ci-postgres-only@localhost:5432/lawpilot
          TEST_APP_DATABASE_URL: postgresql://lawpilot_app:local-dev-app-only@localhost:5432/lawpilot
          TEST_CONTEXT_DATABASE_URL: postgresql://lawpilot_context:local-dev-context-only@localhost:5432/lawpilot
          TEST_INTEGRATION_DATABASE_URL: postgresql://lawpilot_integration:local-dev-integration-only@localhost:5432/lawpilot
          TEST_WORKFLOW_DATABASE_URL: postgresql://lawpilot_workflow:local-dev-workflow-only@localhost:5432/lawpilot
          TEST_DISPATCHER_DATABASE_URL: postgresql://lawpilot_dispatcher:local-dev-dispatcher-only@localhost:5432/lawpilot
          TEMPORAL_BIN: work/temporal
          DOCUMENT_PROCESSOR_BIN: services/document-worker/target/debug/lawpilot-document-worker
        run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng
          mkdir -p work
          curl -fsSL https://github.com/temporalio/cli/releases/download/v1.10.0/temporal_cli_1.10.0_linux_amd64.tar.gz -o work/temporal.tar.gz
          tar -xzf work/temporal.tar.gz -C work temporal
          (cd services/document-worker && cargo +1.90.0 build --locked)
          (cd services/integration-service && go build -o ../../work/integration-service ./cmd/server && go build -o ../../work/document-parser ./cmd/parser)
          (cd services/context-engine && go build -o ../../work/context-engine ./cmd/server)
          (cd services/workflow-service && go build -o ../../work/execution-worker ./cmd/worker && go build -o ../../work/outbox-dispatcher ./cmd/dispatcher)
          node scripts/test_configured_integrations.cjs
          docker compose config -q
          docker build -f services/integration-service/Dockerfile -t lawpilot-integration:ci .
          docker run --rm --entrypoint sh lawpilot-integration:ci -c 'test "$(id -u)" = 10001'
          docker build -f services/document-worker/Dockerfile -t lawpilot-parser:ci .
          docker run --rm --entrypoint sh lawpilot-parser:ci -c 'test "$(id -u)" = 10001 && command -v pdftotext && test -x /usr/local/bin/lawpilot-document-worker'
      - name: Build non-root execution image
        run: |
          docker build -f services/workflow-service/Dockerfile -t lawpilot-execution-worker:ci .
          docker run --rm --entrypoint sh lawpilot-execution-worker:ci -c 'test "$(id -u)" = 10001 && test -r contracts/capabilities/registry.v1.json'
      - name: Durable execution process recovery
        env:
          TEST_DATABASE_URL: postgresql://postgres:local-ci-postgres-only@localhost:5432/lawpilot
          TEST_APP_DATABASE_URL: postgresql://lawpilot_app:local-dev-app-only@localhost:5432/lawpilot
          TEST_WORKFLOW_DATABASE_URL: postgresql://lawpilot_workflow:local-dev-workflow-only@localhost:5432/lawpilot
          TEST_DISPATCHER_DATABASE_URL: postgresql://lawpilot_dispatcher:local-dev-dispatcher-only@localhost:5432/lawpilot
          TEMPORAL_BIN: work/temporal
        run: |
          mkdir -p work
          curl -fsSL https://github.com/temporalio/cli/releases/download/v1.10.0/temporal_cli_1.10.0_linux_amd64.tar.gz -o work/temporal.tar.gz
          tar -xzf work/temporal.tar.gz -C work temporal
          (cd services/workflow-service && go build -o ../../work/execution-worker ./cmd/worker && go build -o ../../work/outbox-dispatcher ./cmd/dispatcher)
          node scripts/test_durable_recovery.cjs
      - name: Calendar and cross-language gRPC integration
        env:
          TEST_DATABASE_URL: postgresql://postgres:local-ci-postgres-only@localhost:5432/lawpilot
          TEST_APP_DATABASE_URL: postgresql://lawpilot_app:local-dev-app-only@localhost:5432/lawpilot
          TEST_CALENDAR_DATABASE_URL: postgresql://lawpilot_calendar:local-dev-calendar-only@localhost:5432/lawpilot
          TEST_WORKFLOW_DATABASE_URL: postgresql://lawpilot_workflow:local-dev-workflow-only@localhost:5432/lawpilot
          TEST_DISPATCHER_DATABASE_URL: postgresql://lawpilot_dispatcher:local-dev-dispatcher-only@localhost:5432/lawpilot
          TEMPORAL_BIN: work/temporal
        run: |
          (cd services/calendar-service && go build -o ../../work/calendar-service ./cmd/server)
          node scripts/test_calendar_grpc.cjs
          docker build -f services/calendar-service/Dockerfile -t lawpilot-calendar:ci .
          docker run --rm --entrypoint sh lawpilot-calendar:ci -c 'test "$(id -u)" = 10001'
      - name: Secure context API, SSE and event-process integration
        env:
          TEST_DATABASE_URL: postgresql://postgres:local-ci-postgres-only@localhost:5432/lawpilot
          TEST_APP_DATABASE_URL: postgresql://lawpilot_app:local-dev-app-only@localhost:5432/lawpilot
          TEST_CONTEXT_DATABASE_URL: postgresql://lawpilot_context:local-dev-context-only@localhost:5432/lawpilot
          TEST_EVENT_DATABASE_URL: postgresql://lawpilot_events:local-dev-events-only@localhost:5432/lawpilot
        run: |
          (cd services/context-engine && go build -o ../../work/context-engine ./cmd/server && go build -o ../../work/domain-events ./cmd/events)
          node scripts/test_secure_context.cjs
          docker build -f services/context-engine/Dockerfile -t lawpilot-context:ci .
          docker run --rm --entrypoint sh lawpilot-context:ci -c 'test "$(id -u)" = 10001 && test -r contracts/events/registry.v1.json'
      - name: Backup and isolated restore with PostgreSQL 18 tools
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec -e PGPASSWORD=local-ci-postgres-only "$PG_CONTAINER" pg_dump -h 127.0.0.1 -U postgres -d lawpilot -Fc -f /tmp/lawpilot-ci.dump
          docker exec -e PGPASSWORD=local-ci-postgres-only "$PG_CONTAINER" createdb -h 127.0.0.1 -U postgres lawpilot_restore_check
          docker exec -e PGPASSWORD=local-ci-postgres-only "$PG_CONTAINER" pg_restore -h 127.0.0.1 -U postgres -d lawpilot_restore_check --exit-on-error /tmp/lawpilot-ci.dump
          docker exec -e PGPASSWORD=local-ci-postgres-only "$PG_CONTAINER" psql -h 127.0.0.1 -U postgres -d lawpilot_restore_check -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF NOT EXISTS(SELECT 1 FROM pg_extension WHERE extname='vector') OR NOT EXISTS(SELECT 1 FROM pg_class WHERE relname='file_ingestions' AND relforcerowsecurity) THEN RAISE EXCEPTION 'restore integrity failed'; END IF; END \$\$;"
          docker exec "$PG_CONTAINER" rm /tmp/lawpilot-ci.dump
      - name: Upload recovery test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: durable-recovery-logs
          path: |
            work/recovery-*/*.log
            work/calendar-grpc-*/*.log
            work/context-grpc-*/*.log
            work/configured-grpc-*/*.log
          if-no-files-found: ignore
