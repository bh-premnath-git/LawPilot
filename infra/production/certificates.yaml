# Requires cert-manager and an operator-provisioned lawpilot-workloads ClusterIssuer.
apiVersion: v1
kind: Namespace
metadata:
  name: lawpilot
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: api-gateway
  namespace: lawpilot
spec:
  secretName: api-gateway-tls
  commonName: api-gateway
  dnsNames:
  - api-gateway
  - api-gateway.lawpilot.svc.cluster.local
  uris:
  - spiffe://lawpilot.local/api-gateway
  duration: 24h
  renewBefore: 8h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
  - server auth
  - client auth
  issuerRef:
    name: lawpilot-workloads
    kind: ClusterIssuer
---
